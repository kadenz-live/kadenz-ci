name: Test

# Shell test gate for entrypoint.sh and its smoke suite.
#
# This exists because `tests/smoke.sh` was added without a runner: a suite that
# is never executed is worse than no suite, because its presence reads as
# coverage. Every change to the entrypoint now has to pass it.
#
# Runs on GitHub-hosted `ubuntu-latest` for the same reason build.yml documents:
# the self-hosted runners this image powers are scoped to kadenz-live/kadenz,
# not to this repo, so this repo's own pipeline must not depend on them. This
# repo is public, so GitHub-hosted minutes are free here — the standing
# "Linux always on kadenz-ci" cost rule applies to the private monorepo.

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: shellcheck + entrypoint smoke tests
    runs-on: ubuntu-latest
    # The suite stubs curl/config.sh/run.sh and touches no network, so it is
    # seconds, not minutes. A ceiling this tight surfaces a hang as a failure
    # rather than as a six-hour default.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Syntax-check every shell script
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            echo "bash -n $f"
            bash -n "$f" || fail=1
          done < <(git ls-files '*.sh')
          exit "$fail"

      - name: shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          # The tree is already clean here; keep it that way rather than
          # accumulating a suppression list.
          git ls-files '*.sh' | xargs -r shellcheck

      - name: entrypoint smoke tests
        # No network is touched: curl, config.sh and run.sh are stubbed by the
        # suite itself, so this can never mint a real registration token.
        run: bash tests/smoke.sh
