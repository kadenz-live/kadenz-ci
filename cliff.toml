# git-cliff configuration — https://git-cliff.org/docs/configuration
#
# Renders the conventional-commit history of kadenz-ci into CHANGELOG.md.
# Driven by .github/workflows/build.yml (orhun/git-cliff-action) on every
# release. Keep the commit_parsers in lock-step with the Conventional Commits
# types this repo uses (feat/fix/chore/docs/ci/build/refactor/perf/test).

[changelog]
# Markdown header for CHANGELOG.md.
header = """
# Changelog

All notable changes to the `ci` runner image are documented here.
Versioning follows [Semantic Versioning](https://semver.org/); every build on
`main` (push / daily schedule / manual dispatch) cuts a new SemVer **patch**.
This file is generated by [git-cliff](https://git-cliff.org) from the
Conventional-Commit history — do not edit by hand.\n
"""
# Per-release body template (Tera).
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim | upper_first }}\
{% if commit.id %} ({{ commit.id | truncate(length=7, end="") }}){% endif %}\
{% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
# Parse commits as Conventional Commits; skip anything that doesn't conform.
conventional_commits = true
filter_unconventional = true
split_commits = false
# Strip the `[skip ci]` marker the changelog bot adds, so it does not show up
# in rendered messages. The bot's own `docs(changelog):` commit is dropped by
# the dedicated skip parser below.
commit_preprocessors = [
  { pattern = " \\[skip ci\\]", replace = "" },
]
commit_parsers = [
  { message = "^docs\\(changelog\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Changed" },
  { message = "^docs", group = "<!-- 4 -->Docs" },
  { message = "^(build|ci)", group = "<!-- 5 -->Build & CI" },
  { message = "^chore", group = "<!-- 6 -->Chores" },
  { message = "^test", group = "<!-- 7 -->Tests" },
  { message = ".*", group = "<!-- 8 -->Other" },
]
protect_breaking_commits = false
filter_commits = false
# Match vX.Y.Z release tags only.
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
topo_order = false
sort_commits = "newest"
